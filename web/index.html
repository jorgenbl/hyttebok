<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hyttebok – dine hytter, rutiner og historier i én bok.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hyttebok">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    /* Startside: krem bakgrunn + hytte-glyf midt i, til Flutter er lastet. */
    html, body { margin: 0; height: 100%; }
    body {
      background-color: #F7F5EF;
      background-image: url(icons/Icon-192.png);
      background-repeat: no-repeat;
      background-position: center;
      background-size: 96px 96px;
    }
  </style>

  <title>Hyttebok</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Brukes av lib/core/io/file_export_web.dart: utløser en filnedlasting
    (data-URL) i nettleseren når appen eksporterer en bok på web.
  -->
  <script>
    window.hyttebokDownload = function (filename, dataUrl) {
      var a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
